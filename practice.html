<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Practice — SNEK.PY</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: #f5f5f5;
        }

        .practice-page {
            width: min(900px, 92%);
            margin: 0 auto;
            padding: 50px 0;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #a78bfa;
            text-decoration: none;
            font-weight: 700;
        }

        .back-link:hover {
            opacity: 0.8;
        }

        .practice-card {
            background: #15151d;
            border: 1px solid #2a2a36;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .practice-label {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 36px;
        }

        .description {
            color: #b8b8c5;
            line-height: 1.7;
            font-size: 16px;
        }

        .challenge-box {
            margin-top: 28px;
            padding: 24px;
            border-radius: 16px;
            background: #101017;
            border: 1px solid #292936;
        }

        .challenge-box h2 {
            margin-top: 0;
            font-size: 21px;
        }

        .challenge-box p {
            line-height: 1.7;
            color: #d4d4dc;
        }

        .example-box {
            margin-top: 18px;
            padding: 15px;
            background: #171720;
            border-radius: 12px;
            border: 1px solid #292936;
        }

        .example-box strong {
            color: #a78bfa;
        }

        .example-box code {
            display: block;
            margin-top: 10px;
            color: #f5f5f5;
            font-family: Consolas, monospace;
        }

        textarea {
            width: 100%;
            min-height: 190px;
            margin-top: 25px;
            padding: 18px;
            resize: vertical;

            border: 1px solid #343442;
            border-radius: 14px;

            background: #0b0b0f;
            color: #f5f5f5;

            font-family: Consolas, monospace;
            font-size: 15px;

            outline: none;
        }

        textarea:focus {
            border-color: #8b5cf6;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        button,
        .secondary-button {
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
        }

        .check-button {
            background: #8b5cf6;
            color: white;
        }

        .check-button:hover {
            opacity: 0.9;
        }

        .secondary-button {
            background: #22222d;
            color: #ddd;
        }

        .secondary-button:hover {
            background: #2c2c39;
        }

        .feedback {
            display: none;
            margin-top: 24px;
            padding: 20px;
            border-radius: 15px;
            line-height: 1.7;
        }

        .feedback.success {
            display: block;
            background: rgba(34, 197, 94, 0.10);
            border: 1px solid rgba(34, 197, 94, 0.30);
        }

        .feedback.error {
            display: block;
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.30);
        }

        .xp {
            margin-top: 10px;
            font-weight: 800;
            color: #facc15;
        }

        body.light {
            background: #f7f7fb;
            color: #17171f;
        }

        body.light .practice-card {
            background: white;
            border-color: #e5e7eb;
        }

        body.light .description {
            color: #555;
        }

        body.light .challenge-box {
            background: #f8f8fc;
            border-color: #e5e7eb;
        }

        body.light .challenge-box p {
            color: #444;
        }

        body.light .example-box {
            background: #f2f2f7;
            border-color: #ddd;
        }

        body.light .example-box code {
            color: #222;
        }

        body.light textarea {
            background: #fff;
            color: #222;
            border-color: #d1d5db;
        }

        @media (max-width: 600px) {

            .practice-page {
                padding: 30px 0;
            }

            .practice-card {
                padding: 22px;
            }

            h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

<div class="practice-page">

    <a
        class="back-link"
        href="{{ url_for('lesson', lesson_id=lesson_id) }}"
    >
        ← Back to Lesson
    </a>

    <div class="practice-card">

        <span class="practice-label">
            SNEK.PY • PRACTICE
        </span>

        <h1>
            🎯 {{ practice.title }}
        </h1>

        <p class="description">
            Test your understanding by writing a small Python program.
        </p>

        <div class="challenge-box">

            <h2>
                Your Challenge
            </h2>

            <p>
                {{ practice.challenge }}
            </p>

            <div class="example-box">

                <strong>
                    Example
                </strong>

                <code>
                    {{ practice.example }}
                </code>

            </div>

        </div>

        <textarea
            id="answerBox"
            placeholder="Write your Python code here..."
        ></textarea>

        <div class="button-row">

            <button
                class="check-button"
                id="checkButton"
                type="button"
            >
                Check Answer ✓
            </button>


            <form
    method="POST"
    action="{{ url_for('complete_practice', lesson_id=lesson_id) }}"
    style="display: inline;"
>
    <button
        class="check-button"
        type="submit"
    >
        Complete Practice ⭐
    </button>
</form>


            <a
                class="secondary-button"
                href="{{ url_for('code_lab') }}"
            >
                Open Code Lab →
            </a>

        </div>

        <div
            class="feedback"
            id="feedback"
        ></div>

    </div>

</div>


<script>

    const checkButton =
        document.getElementById("checkButton");

    const answerBox =
        document.getElementById("answerBox");

    const feedback =
        document.getElementById("feedback");


    checkButton.addEventListener(
        "click",
        function () {

            const answer =
                answerBox.value.trim();


            if (!answer) {

                feedback.className =
                    "feedback error";

                feedback.innerHTML =
                    "⚠️ Please write some Python code before checking your answer.";

                return;
            }


            const expected =
                `{{ practice.expected }}`;


            if (
                answer.replace(/\s/g, "") ===
                expected.replace(/\s/g, "")
            ) {

                feedback.className =
                    "feedback success";

                feedback.innerHTML =
                    `
                    🎉 <strong>Correct!</strong>

                    <br><br>

                    Your solution matches the expected answer.

                    <div class="xp">
                        ⭐ +20 XP
                    </div>
                    `;

            } else {

                feedback.className =
                    "feedback error";

                feedback.innerHTML =
                    `
                    ❌ <strong>Not quite yet.</strong>

                    <br><br>

                    Try checking your variable names,
                    syntax, and output.

                    <br><br>

                    You can use the Code Lab to test your program.
                    `;

            }

        }
    );

</script>

</body>
</html>
